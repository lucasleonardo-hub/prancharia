<title>Prancharia</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/app.css">

<div id="app">
  <aside id="lateral">
    <button type="button" class="marca" data-rota="empreendimentos" aria-label="Voltar para os empreendimentos">
      <svg class="marca-glifo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="2.5" y="3.5" width="19" height="17" rx="1.5"/>
        <path d="M2.5 9h19M8.5 9v11.5"/>
        <circle cx="15" cy="14" r="2.6"/>
      </svg>
      <div>
        <div class="marca-nome">Prancharia</div>
        <div class="marca-sub">análise de pranchas</div>
      </div>
    </button>
    <nav id="nav" aria-label="Seções"></nav>
    <div class="estado-sistema" id="estadoSistema" aria-label="Estado do sistema"></div>
  </aside>

  <div id="principal">
    <header id="barra">
      <button class="btn discreto" id="abrirMenu" data-acao="menu" aria-label="Abrir menu" style="padding:7px">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="trilha" id="trilha"></div>
      <button class="btn discreto" data-acao="tema" style="margin-left:auto;padding:7px;flex:none" aria-label="Alternar tema" title="Alternar tema">
        <svg class="ico tema-sol" viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <svg class="ico tema-lua" viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/>
        </svg></button>
    </header>
    <main id="conteudo">
      <div class="faixa"><div class="vazio"><h3>Carregando…</h3></div></div>
    </main>
  </div>
</div>

<div id="veu" hidden data-acao="fecharGaveta"></div>
<div id="modal" hidden></div>
<aside id="gaveta" aria-label="Evidências"></aside>

<script type="module">
  import { iniciarApp } from './js/app.js';
  iniciarApp().catch(err => {
    console.error(err);
    document.getElementById('conteudo').innerHTML =
      '<div class="faixa"><div class="cartao"><div class="vazio"><h3>Não foi possível iniciar</h3><p>' +
      String(err && err.message || err).replace(/[<>&]/g, '') + '</p></div></div></div>';
  });
</script>
