services:
  - type: web
    name: prancharia-bff
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Preenchida à mão no painel do Render (Environment) — nunca aqui no arquivo.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # node:sqlite (usado por server/db.js quando better-sqlite3 não está
      # instalado) só funciona sem flag a partir do Node 22.13+; abaixo disso
      # o servidor derruba com ERR_UNKNOWN_BUILTIN_MODULE ao iniciar.
      - key: NODE_VERSION
        value: 24.21.0
      - key: CORS_ORIGIN
        value: "https://prancharia.vercel.app"
      # BANCO PERSISTENTE — OBRIGATÓRIO NO PLANO FREE. O disco do Render free
      # é efêmero: /server/dados (SQLite + PDFs) some a cada hibernação ou
      # deploy, e é isso que fazia os empreendimentos "sumirem em outro
      # navegador". Crie um banco gratuito em https://turso.tech e preencha os
      # dois valores à mão no painel Environment do Render (ver LEIA-ME).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # "banco" guarda os PDFs das pranchas na tabela blobs do próprio banco —
      # o único lugar que sobrevive ao reinício no plano free.
      - key: ARMAZENAMENTO
        value: banco
    # Alternativa ao Turso: disco persistente (plano "starter" ou superior).
    # Descomente o bloco abaixo, troque o plano e aponte DADOS_DIR para o mount.
    # disk:
    #   name: prancharia-dados
    #   mountPath: /opt/render/project/src/server/dados
    #   sizeGB: 1
