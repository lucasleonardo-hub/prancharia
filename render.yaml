services:
  - type: web
    name: prancharia-bff
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Preenchida à mão no painel do Render (Environment) — nunca aqui no arquivo.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # node:sqlite (usado por server/db.js quando better-sqlite3 não está
      # instalado) só funciona sem flag a partir do Node 22.13+; abaixo disso
      # o servidor derruba com ERR_UNKNOWN_BUILTIN_MODULE ao iniciar.
      - key: NODE_VERSION
        value: 24.21.0
      - key: CORS_ORIGIN
        value: "https://prancharia.vercel.app"
    # O plano "free" do Render não suporta disco persistente: o SQLite e as
    # pranchas em /server/dados somem a cada deploy/reinício. Descomente o
    # bloco abaixo (e troque o plano para "starter" ou superior) para manter
    # os dados entre deploys.
    # disk:
    #   name: prancharia-dados
    #   mountPath: /opt/render/project/src/server/dados
    #   sizeGB: 1
